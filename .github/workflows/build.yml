
name: Build MuazNotch

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          unzip -q MuazNotch.zip -d project
          chmod +x project/MuazNotch/gradlew

      - name: Build APK
        run: |
          cd project/MuazNotch
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MuazNotch-APK
          path: project/MuazNotch/app/build/outputs/apk/debug/*.apk
